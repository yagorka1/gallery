<mat-toolbar class="header">
  <nav class="nav">
    <a
      mat-button
      class="nav__link"
      routerLink="/"
      routerLinkActive="nav__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>photo_library</mat-icon>
      <span>Photos</span>
    </a>

    <a
      mat-button
      class="nav__link"
      routerLink="/favorites"
      routerLinkActive="nav__link--active"
    >
      <mat-icon>favorite</mat-icon>
      <span>Favorites</span>
    </a>
  </nav>
</mat-toolbar>
