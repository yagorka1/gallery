<div class="photo-list">
  @for (photo of photos(); track photo.id) {
    <app-photo-card [photo]="photo" (cardClick)="addToFavorite($event)"></app-photo-card>
  }
</div>

<div #anchor class="anchor"></div>

<div class="loader" [class.loader--active]="isLoading()">
  <mat-spinner diameter="40"></mat-spinner>
</div>
